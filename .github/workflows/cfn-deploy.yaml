name: Deploy Stack

on:
  workflow_call:
    inputs:
      # GitHub Environment (ci, devl, test, prod)
      environment:
        description: "GitHub environment name for accessing environment-scoped variables. Must be one of: ci, devl, test, prod."
        required: false
        type: string
        default: "ci"

      # Concurrency group name (optional - allows caller to customize)
      concurrency-group:
        description: "Concurrency group name for workflow runs"
        required: false
        type: string
        default: ""

      # AWS Configuration
      aws-region:
        description: "AWS region for CloudFormation deployment"
        required: true
        type: string
        default: "us-east-1"

      aws-account-id:
        description: "AWS account ID for OIDC role assumption"
        required: true
        type: string

      oidc-role-name:
        description: "IAM role name for OIDC authentication"
        required: true
        type: string

      # S3 Configuration for CloudFormation Templates
      cfn-templates-s3-bucket:
        description: "S3 bucket name for storing CloudFormation templates"
        required: true
        type: string

      # Stack Configuration
      stack-name:
        description: "CloudFormation stack name"
        required: false
        type: string
        default: ""

      # Parameters Configuration
      parameters-file:
        description: "Path to CloudFormation parameters file"
        required: false
        type: string
        default: "infra/parameters.json"

      template-file:
        description: "Path to CloudFormation template file"
        required: false
        type: string
        default: "infra/template.yaml"

permissions:
  id-token: write
  contents: read
  actions: write

concurrency:
  group: ${{ inputs.concurrency-group || format('cfn-deploy-{0}-{1}', inputs.environment, github.ref) }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  environment-check:
    name: Environment Check
    runs-on: ubuntu-latest
    outputs:
      ci-prefix: ${{ steps.ci-prefix.outputs.prefix }}
      stack-name: ${{ steps.prepare-stack-name.outputs.stack-name }}
    steps:
      - name: Validate Environment
        id: validate-env
        shell: bash
        run: |
          # Validate environment input
          if [[ "${{ inputs.environment }}" != "ci" && "${{ inputs.environment }}" != "devl" && "${{ inputs.environment }}" != "test" && "${{ inputs.environment }}" != "prod" ]]; then
            echo "Error: Invalid environment '${{ inputs.environment }}'. Must be one of: ci, devl, test, prod"
            exit 1
          fi
          echo "✅ Valid environment: ${{ inputs.environment }}"

      - name: Check if Artifact Exists
        id: check-artifact
        shell: bash
        run: |
          ARTIFACT_NAME="cfn-deploy-params"

          # Check if artifact exists using GitHub API
          ARTIFACT_ID=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .id" 2>/dev/null)

          if [[ -n "$ARTIFACT_ID" ]]; then
            echo "artifact-exists=true" >> $GITHUB_OUTPUT
            echo "✅ Artifact exists: $ARTIFACT_NAME (ID: $ARTIFACT_ID)"
          else
            echo "artifact-exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Artifact does not exist: $ARTIFACT_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download Previous Artifacts
        id: download-artifact
        if: steps.check-artifact.outputs.artifact-exists == 'true'
        uses: actions/download-artifact@v8
        with:
          name: cfn-deploy-params
          path: .artifacts

      - name: Check Artifact Download
        shell: bash
        run: |
          if [[ "${{ steps.check-artifact.outputs.artifact-exists }}" == "false" ]]; then
            echo "ℹ️  Artifact does not exist - skipping download (expected on first run)"
          elif [[ "${{ steps.download-artifact.outcome }}" == "success" && -f ".artifacts/infra/parameters-updated.json" ]]; then
            echo "✅ Successfully downloaded previous artifact"
          else
            echo "⚠️  Artifact exists but download failed"
          fi

      - name: Generate CI Prefix
        id: ci-prefix
        shell: bash
        run: |
          if [[ "${{ inputs.environment }}" == "ci" ]]; then
            # Try to read existing CI_PREFIX from artifact
            if [[ -f ".artifacts/cfn-params.json" ]]; then
              CI_PREFIX=$(jq -r '.CiPrefix // empty' .artifacts/cfn-params.json 2>/dev/null)
              if [[ -n "$CI_PREFIX" ]]; then
                echo "prefix=${CI_PREFIX}" >> $GITHUB_OUTPUT
                echo "✅ Reused existing CI prefix from artifact: ${CI_PREFIX}"
              else
                CI_PREFIX=$(openssl rand -hex 2 | tr -d '\n')
                echo "prefix=${CI_PREFIX}" >> $GITHUB_OUTPUT
                echo "✅ Generated new CI prefix: ${CI_PREFIX}"
              fi
            else
              CI_PREFIX=$(openssl rand -hex 2 | tr -d '\n')
              echo "prefix=${CI_PREFIX}" >> $GITHUB_OUTPUT
              echo "✅ Generated new CI prefix: ${CI_PREFIX}"
            fi
          else
            echo "prefix=" >> $GITHUB_OUTPUT
            echo "ℹ️  Skipping CI prefix generation (environment: ${{ inputs.environment }})"
          fi

      - name: Prepare Stack Name
        id: prepare-stack-name
        shell: bash
        run: |
          CI_PREFIX="${{ steps.ci-prefix.outputs.prefix }}"
          STACK_NAME="${{ inputs.stack-name }}"
          if [[ -z "$STACK_NAME" ]]; then
            STACK_NAME="${{ github.event.repository.name }}"
          fi

          if [[ -n "$CI_PREFIX" ]]; then
            FINAL_STACK_NAME="${STACK_NAME}-${CI_PREFIX}"
          else
            FINAL_STACK_NAME="${STACK_NAME}"
          fi

          echo "stack-name=${FINAL_STACK_NAME}" >> $GITHUB_OUTPUT
          echo "✅ Final stack name: ${FINAL_STACK_NAME}"

  validate:
    name: Validate CloudFormation Template
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/${{ inputs.oidc-role-name }}
          aws-region: ${{ inputs.aws-region }}

      - name: Verify AWS Credentials
        run: |
          echo "✅ Successfully configured AWS credentials"
          aws sts get-caller-identity

      - name: Extract Template Directory and Filename
        id: template-paths
        shell: bash
        run: |
          TEMPLATE_FILE="${{ inputs.template-file }}"
          TEMPLATE_DIR=$(dirname "$TEMPLATE_FILE")
          TEMPLATE_FILENAME=$(basename "$TEMPLATE_FILE")
          echo "directory=$TEMPLATE_DIR" >> $GITHUB_OUTPUT
          echo "filename=$TEMPLATE_FILENAME" >> $GITHUB_OUTPUT

      - name: Validate CloudFormation Templates
        uses: subhamay-bhattacharyya-gha/cfn-validate-action@main
        with:
          aws-role-arn: arn:aws:iam::${{ inputs.aws-account-id }}:role/${{ inputs.oidc-role-name }}
          cloudformation-dir: ${{ steps.template-paths.outputs.directory }}
          template-file: ${{ steps.template-paths.outputs.filename }}
          aws-region: ${{ inputs.aws-region }}

      - name: Run CloudFormation Lint
        uses: subhamay-bhattacharyya-gha/cfn-lint-action@v1.0.0
        with:
          template-path: ${{ inputs.template-file }}

  upload-to-s3:
    name: Upload Template to S3
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: validate
    permissions:
      id-token: write
      contents: read
    outputs:
      template_url: ${{ steps.upload.outputs.template_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/${{ inputs.oidc-role-name }}
          aws-region: ${{ inputs.aws-region }}

      - name: Upload template to S3 and set output
        id: upload
        run: |
          TEMPLATE_FILENAME=$(basename "${{ inputs.template-file }}")
          TEMPLATE_KEY="${{ github.event.repository.name }}/${TEMPLATE_FILENAME}"
          echo "Uploading template to S3..."
          aws s3 cp ${{ inputs.template-file }} "s3://${{ inputs.cfn-templates-s3-bucket }}/${TEMPLATE_KEY}" --region ${{ inputs.aws-region }}

          TEMPLATE_URL="https://${{ inputs.cfn-templates-s3-bucket }}.s3.${{ inputs.aws-region }}.amazonaws.com/${TEMPLATE_KEY}"
          echo "template_url=${TEMPLATE_URL}" >> $GITHUB_OUTPUT
          echo "Template URL: ${TEMPLATE_URL}"
          echo "✅ Template uploaded to S3"

  deploy:
    name: Deploy Stack
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs:
      - environment-check
      - upload-to-s3
    permissions:
      id-token: write
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/${{ inputs.oidc-role-name }}
          aws-region: ${{ inputs.aws-region }}

      - name: Prepare CloudFormation Parameters with CiPrefix
        id: prepare-params
        shell: bash
        run: |
          set -e
          CI_PREFIX="${{ needs.environment-check.outputs.ci-prefix }}"
          PARAMS_FILE="${{ inputs.parameters-file }}"

          if [[ -f "$PARAMS_FILE" ]]; then
            echo "Reading parameters from: $PARAMS_FILE"
            PARAMS=$(cat "$PARAMS_FILE")
          else
            echo "⚠️  Parameters file not found: $PARAMS_FILE. Using empty object."
            PARAMS="{}"
          fi

          # Validate JSON is parseable
          if ! echo "$PARAMS" | jq empty 2>/dev/null; then
            echo "❌ Error: Invalid JSON in parameters file"
            exit 1
          fi

          # Convert to object if it's an array
          PARAMS_TYPE=$(echo "$PARAMS" | jq -r 'type')
          if [[ "$PARAMS_TYPE" == "array" ]]; then
            echo "⚠️  Parameters file contains an array. Converting to object..."
            PARAMS="{}"
          fi

          if [[ -n "$CI_PREFIX" ]]; then
            PARAMS=$(echo "$PARAMS" | jq --arg prefix "$CI_PREFIX" '.CiPrefix = $prefix')
            echo "✅ Added CiPrefix parameter: $CI_PREFIX"
          else
            echo "ℹ️  Skipping CiPrefix parameter (not in CI environment)"
          fi

          echo "$PARAMS" | jq . > infra/parameters-updated.json
          echo "parameters_file=infra/parameters-updated.json" >> $GITHUB_OUTPUT

      - name: Display Input Parameters Summary
        shell: bash
        run: |
          {
            echo "## 🚀 CloudFormation Deployment Parameters"
            echo ""
            echo "### Workflow Inputs"
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| Environment | ${{ inputs.environment }} |"
            echo "| AWS Region | ${{ inputs.aws-region }} |"
            echo "| AWS Account ID | ${{ inputs.aws-account-id }} |"
            echo "| OIDC Role Name | ${{ inputs.oidc-role-name }} |"
            echo "| CFN Templates S3 Bucket | ${{ inputs.cfn-templates-s3-bucket }} |"
            echo "| Stack Name | ${{ inputs.stack-name != '' && inputs.stack-name || 'default (repository name)' }} |"
            echo "| Template File | ${{ inputs.template-file }} |"
            echo "| Parameters File | ${{ inputs.parameters-file }} |"
            echo "| Concurrency Group | ${{ inputs.concurrency-group != '' && inputs.concurrency-group || 'default (auto-generated)' }} |"
            echo ""
            echo "### Computed Values"
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| CI Prefix | ${{ needs.environment-check.outputs.ci-prefix != '' && needs.environment-check.outputs.ci-prefix || 'N/A (not in CI)' }} |"
            echo "| Final Stack Name | ${{ needs.environment-check.outputs.stack-name }} |"
            echo "| Template URL | ${{ needs.upload-to-s3.outputs.template_url }} |"
            echo "| Parameters File | infra/parameters-updated.json |"
            echo ""
            echo "### CloudFormation Parameters"
            echo "| Parameter Name | Value |"
            echo "|---|---|"
            cat infra/parameters-updated.json | jq -r 'to_entries[] | "| \(.key) | \(.value) |"'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload Parameters as Artifact (for failure recovery)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cfn-deploy-params
          path: ${{ steps.prepare-params.outputs.parameters_file }}
          retention-days: 1

      - name: Delete Existing Stack in CI Environment
        if: inputs.environment == 'ci'
        shell: bash
        run: |
          STACK_NAME="${{ needs.environment-check.outputs.stack-name }}"
          REGION="${{ inputs.aws-region }}"

          echo "🗑️  Checking if stack exists: $STACK_NAME"

          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$REGION" 2>/dev/null; then
            echo "🗑️  Stack exists. Deleting stack: $STACK_NAME"
            aws cloudformation delete-stack --stack-name "$STACK_NAME" --region "$REGION"

            echo "⏳ Waiting for stack deletion to complete..."
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" --region "$REGION" || true
            echo "✅ Stack deletion complete"
          else
            echo "ℹ️  Stack does not exist: $STACK_NAME. Proceeding with creation..."
          fi

      - name: Deploy CloudFormation Stack
        id: deploy
        continue-on-error: true
        uses: subhamay-bhattacharyya-gha/cfn-deploy-action@v1.0.0
        with:
          stack-name: ${{ needs.environment-check.outputs.stack-name }}
          region: ${{ inputs.aws-region }}
          template-url: ${{ needs.upload-to-s3.outputs.template_url }}
          parameters-file: ${{ steps.prepare-params.outputs.parameters_file }}
          aws-account-id: ${{ inputs.aws-account-id }}
          oidc-role-name: ${{ inputs.oidc-role-name }}

      - name: Handle Deployment Result
        shell: bash
        run: |
          DEPLOY_STATUS="${{ steps.deploy.outcome }}"
          STACK_NAME="${{ needs.environment-check.outputs.stack-name }}"
          REGION="${{ inputs.aws-region }}"

          if [[ "$DEPLOY_STATUS" == "success" ]]; then
            echo "✅ CloudFormation stack deployed successfully: $STACK_NAME"
            exit 0
          else
            # Check if the error is "No updates are to be performed"
            echo "⏳ Checking if stack needs updates..."

            STACK_STATUS=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$REGION" \
              --query 'Stacks[0].StackStatus' \
              --output text 2>/dev/null || echo "DOES_NOT_EXIST")

            if [[ "$STACK_STATUS" == "CREATE_COMPLETE" || "$STACK_STATUS" == "UPDATE_COMPLETE" ]]; then
              echo "✅ Stack is up-to-date (no updates needed): $STACK_NAME"
              echo "ℹ️  Stack Status: $STACK_STATUS"
              exit 0
            else
              echo "❌ Deployment failed"
              echo "Stack Status: $STACK_STATUS"
              exit 1
            fi
          fi
        env:
          AWS_REGION: ${{ inputs.aws-region }}

      - name: Delete Artifact on Successful Deployment
        if: success()
        shell: bash
        run: |
          ARTIFACT_NAME="cfn-deploy-params"

          echo "🗑️  Attempting to delete artifact: $ARTIFACT_NAME"

          # Get artifact ID
          ARTIFACT_ID=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .id" 2>/dev/null)

          if [[ -z "$ARTIFACT_ID" ]]; then
            echo "ℹ️  Artifact does not exist or already deleted: $ARTIFACT_NAME"
            exit 0
          fi

          # Try to delete with better error handling
          if gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID 2>/dev/null; then
            echo "✅ Successfully deleted artifact: $ARTIFACT_NAME (ID: $ARTIFACT_ID)"
          else
            # If 403 error, log it but don't fail
            echo "⚠️  Could not delete artifact (may lack permissions): $ARTIFACT_NAME"
            echo "ℹ️  This is expected if the workflow doesn't have 'actions: write' permission"
            exit 0
          fi
        env:
          GH_TOKEN: ${{ github.token }}